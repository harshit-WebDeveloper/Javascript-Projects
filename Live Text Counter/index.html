<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Text Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>📝Live Text Counter</h1>
      <textarea id="text-input" placeholder="Start typing..."></textarea>
      <div class="output">
        <p>Characters → <span id="char-count">0</span></p>
        <p>Word → <span id="word-count">0</span></p>
        <p>Line → <span id="line-count">0</span></p>
      </div>
    </div>
    <script src="logic.js"></script>
  </body>
</html>
